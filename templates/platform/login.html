<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <h1 style="font-size: 1.25rem; color: #9b2c2c;">Platform Administration</h1>
            <p class="subtitle">Authorized personnel only</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('platform_login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-danger" style="width: 100%; justify-content: center;">Access Panel</button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: #a0aec0;">
                <a href="{{ url_for('index') }}" style="color: #a0aec0;">Back to homepage</a>
            </p>
        </div>
    </div>
</body>
</html>
