services:
  - type: web
    name: facultyconnect
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from app import app, init_db; app.app_context().push(); init_db(); from seed import seed; seed()" && gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"
